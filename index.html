<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وێبسايتێ مەکتەبێ</title>
    <!-- فۆنتێ سادە و جوان -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e5ec 0%, #ffffff 100%);
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(106, 4, 15, 0.15); top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: rgba(0, 0, 0, 0.05); bottom: 100px; left: -50px; }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 2px solid rgba(255, 255, 255, 0.8);
            height: 100vh;
            position: fixed;
            right: -300px;
            top: 0;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
            padding-top: 90px;
        }

        .sidebar.active { right: 0; }

        .sidebar ul { list-style: none; padding: 20px; }
        .sidebar ul li { margin-bottom: 20px; perspective: 1000px; }

        .sidebar ul li button {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 800;
            color: #6a040f;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05), inset 0 2px 5px rgba(255,255,255,1);
            transform-style: preserve-3d;
        }

        .sidebar ul li button:hover {
            background: linear-gradient(135deg, #6a040f, #9d0208);
            color: white;
            transform: translateZ(10px) translateY(-3px);
            box-shadow: 0 10px 20px rgba(106, 4, 15, 0.3), inset 0 2px 5px rgba(255,255,255,0.2);
            border-color: transparent;
        }

        .menu-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            color: #6a040f;
            font-size: 26px;
            border-radius: 15px;
            width: 55px;
            height: 55px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1), inset 0 2px 5px rgba(255,255,255,1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 12px 25px rgba(106, 4, 15, 0.2);
            background: #6a040f;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 100px 30px 50px;
            transition: 0.4s;
            display: flex;
            justify-content: center;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 1000px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .active-page { display: block; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.08),
                inset 0 2px 10px rgba(255, 255, 255, 0.8),
                inset 0 -2px 10px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 10;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            perspective: 1000px;
        }

        input[type="text"] {
            flex: 1;
            padding: 18px 25px;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 700;
            outline: none;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.04), 0 5px 15px rgba(0,0,0,0.02);
            transition: all 0.3s;
        }
        
        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #6a040f;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.04), 0 5px 20px rgba(106, 4, 15, 0.15);
            transform: translateZ(10px);
        }

        button.add-btn {
            padding: 0 35px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #9d0208, #6a040f);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(106, 4, 15, 0.3), inset 0 2px 5px rgba(255,255,255,0.3);
            transform-style: preserve-3d;
        }

        button.add-btn:hover {
            transform: translateY(-4px) translateZ(15px);
            box-shadow: 0 12px 25px rgba(106, 4, 15, 0.5), inset 0 2px 5px rgba(255,255,255,0.4);
        }

        .task-list { list-style: none; perspective: 1000px; }

        .task-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px 25px;
            border-radius: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 15px rgba(0,0,0,0.04), inset 0 2px 5px rgba(255,255,255,1);
            transform-style: preserve-3d;
        }

        .task-item:hover {
            transform: scale(1.02) translateY(-3px) translateZ(10px);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 25px rgba(106, 4, 15, 0.12);
            border-color: #6a040f;
        }

        .task-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            cursor: pointer;
        }

        .task-content span {
            font-size: 17px;
            font-weight: 700;
            color: #2d3436;
        }

        .task-status {
            font-size: 13px;
            color: #6a040f;
            margin-top: 5px;
            font-weight: bold;
        }

        .task-item.completed {
            background: rgba(200, 200, 200, 0.3);
            border-color: transparent;
            box-shadow: none;
        }

        .task-item.completed .task-content span {
            text-decoration: line-through;
            color: #a0a0a0;
        }

        .task-item.completed .task-status {
            color: #27ae60;
        }

        .delete-btn {
            background: white;
            color: #d63031;
            border: 2px solid #d63031;
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.1);
            margin-right: 15px;
        }

        .delete-btn:hover {
            background: #d63031;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.3);
        }

        .table-container {
            perspective: 1200px;
            overflow-x: auto;
            padding-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 12px;
            transform-style: preserve-3d;
        }

        th {
            background: linear-gradient(135deg, #6a040f, #9d0208);
            color: white;
            padding: 20px 15px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 17px;
            box-shadow: 0 8px 20px rgba(106, 4, 15, 0.3), inset 0 2px 5px rgba(255,255,255,0.3);
        }

        td {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px 15px;
            text-align: center;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 1);
            font-size: 16px;
            font-weight: 700;
            color: #2d3436;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04), inset 0 2px 8px rgba(255,255,255,1);
            transform-style: preserve-3d;
        }

        td:hover {
            transform: translateY(-8px) scale(1.08) translateZ(30px);
            background: linear-gradient(135deg, #ffffff, #f9f9f9);
            box-shadow: 
                0 20px 35px rgba(106, 4, 15, 0.25), 
                0 10px 15px rgba(0,0,0,0.1),
                inset 0 2px 5px rgba(255,255,255,1);
            border: 2px solid #6a040f;
            color: #6a040f;
            z-index: 100;
            position: relative;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(106, 4, 15, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6a040f; }

        @media (max-width: 768px) {
            table { border-spacing: 8px; }
            th, td { padding: 12px; font-size: 14px; }
            .glass-card { padding: 25px; border-radius: 20px; }
            td:hover { transform: translateY(-5px) scale(1.05) translateZ(15px); }
            .main-content { padding: 90px 15px 30px; }
            input[type="text"], button.add-btn { font-size: 15px; padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <ul>
            <li><button onclick="showPage('tasksPage')">ئەرکێن من</button></li>
            <li><button onclick="showPage('timetablePage')">خشتەیێ وانەیان</button></li>
        </ul>
    </div>

    <div class="main-content">
        
        <div id="tasksPage" class="page active-page glass-card">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="ئەرکێ خۆ ل ڤێرە بنڤیسە...">
                <button class="add-btn" onclick="addTask()">زێدە بکە</button>
            </div>
            <ul class="task-list" id="taskList">
                <!-- ئەرک دێ ل ڤێرە هێنە نیشاندان -->
            </ul>
        </div>

        <div id="timetablePage" class="page glass-card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>رۆژ</th>
                            <th>١</th>
                            <th>٢</th>
                            <th>٣</th>
                            <th>٤</th>
                            <th>٥</th>
                            <th>٦</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th>ئێک شەمب</th>
                            <td>زیندەوەر</td><td>کۆمپیوتەر</td><td>فیزیا</td><td>بیرکاری</td><td>ئینگلیزی</td><td>کیمیا</td>
                        </tr>
                        <tr>
                            <th>دوو شەمب</th>
                            <td>فیزیا</td><td>عەرەبی</td><td>کیمیا</td><td>بیرکاری</td><td>کوردی</td><td>ئینگلیزی</td>
                        </tr>
                        <tr>
                            <th>سێ شەمب</th>
                            <td>ئینگلیزی</td><td>فیزیا</td><td>بیرکاری</td><td>کوردی</td><td>ئایین</td><td>زیندەوەر</td>
                        </tr>
                        <tr>
                            <th>چار شەمب</th>
                            <td>عەرەبی</td><td>وەرزش</td><td>ئینگلیزی</td><td>ماف</td><td>کیمیا</td><td>بیرکاری</td>
                        </tr>
                        <tr>
                            <th>پێنج شەمب</th>
                            <td>کوردی</td><td>کیمیا</td><td>زیندەوەر</td><td>فیزیا</td><td>هونەر</td><td>عەرەبی</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBkguj6Z7B8OFilq-iOpq9sZPUKJjviZf0",
            authDomain: "ark-male.firebaseapp.com",
            databaseURL: "https://ark-male-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ark-male",
            storageBucket: "ark-male.firebasestorage.app",
            messagingSenderId: "373015135583",
            appId: "1:373015135583:web:c7f894ef0a48ccadc4a2ea",
            measurementId: "G-FLZ7Z72M3Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const tasksRef = ref(db, 'tasks');

        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        // کۆدێ وەرگرتنا لیستەیا ئەو ئەرکێن کو ڤی مۆبایلی/کۆمپیوتەری کلیک کرین
        function getMyClickedTasks() {
            return JSON.parse(localStorage.getItem('myClickedTasks') || '[]');
        }

        function saveMyClickedTask(taskId) {
            const clicked = getMyClickedTasks();
            if (!clicked.includes(taskId)) {
                clicked.push(taskId);
                localStorage.setItem('myClickedTasks', JSON.stringify(clicked));
            }
        }

        window.addTask = async function() {
            const text = taskInput.value.trim();
            if (text) {
                await push(tasksRef, {
                    text: text,
                    clicks: 0,
                    completed: false,
                    timestamp: Date.now()
                });
                taskInput.value = '';
            }
        };

        onValue(tasksRef, (snapshot) => {
            taskList.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                const tasksArray = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => a.timestamp - b.timestamp);

                tasksArray.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    
                    let clicks = task.clicks || 0;
                    let statusText = "";
                    
                    if (task.completed) {
                        statusText = "هەردوویان ئەرکێ خۆ کر ✔️";
                    } else if (clicks === 1) {
                        statusText = "ئێک ژ وە یێ کری (ل هیڤیا یێ دی) ⏳";
                    } else {
                        statusText = "هێشتا چ کەسان نەکریە";
                    }

                    li.innerHTML = `
                        <div class="task-content" onclick="toggleTask('${task.id}', ${clicks}, ${task.completed})">
                            <span>${task.text}</span>
                            <div class="task-status">${statusText}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteTask('${task.id}')">ژێبرن</button>
                    `;
                    taskList.appendChild(li);
                });
            }
        });

        window.toggleTask = async function(taskId, currentClicks, isCompleted) {
            if (isCompleted) return; // ئەگەر هەردوویان کربیت، چو کار ناکەت

            const myClickedTasks = getMyClickedTasks();
            
            // ئەگەر تە پێشتر کلیک کربیت، ناهێلیت جارەکا دی کلیک بکەی
            if (myClickedTasks.includes(taskId)) {
                alert("تە ئەرکێ خۆ یێ بجهئینای! ل هیڤیا هەڤالێ خۆ بە دا ئەو ژی تەمام کەت.");
                return;
            }

            // ئەگەر تە کلیک نەکربیت، کلیکەکێ زێدە دکەت
            let newClicks = currentClicks + 1;
            let willBeCompleted = newClicks >= 2;

            const taskRef = ref(db, 'tasks/' + taskId);
            await update(taskRef, { 
                clicks: newClicks,
                completed: willBeCompleted 
            });

            // ئەرکی د براوسەرێ تە دا دپارێزیت دا کو تو نەشێی دووبارە کلیک بکەی
            saveMyClickedTask(taskId);
        };

        window.deleteTask = async function(taskId) {
            const taskRef = ref(db, 'tasks/' + taskId);
            await remove(taskRef);
        };

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('active');
        };

        window.showPage = function(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
        };
    </script>
</body>
</html>
